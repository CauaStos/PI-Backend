services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # Replica set de no unico no: habilita transacoes usadas pelos services.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - onstage-mongo:/data/db
    healthcheck:
      # Inicia o replica set na primeira subida e depois verifica o primario.
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet --eval ''db.hello().isWritablePrimary || rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]})''',
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 5s

  api:
    build: .
    restart: unless-stopped
    environment:
      # Deploy privado na tailnet: roda em dev para habilitar o link de reset no
      # console (AUTH_PASSWORD_RESET_CONSOLE_URL). Não é produção pública.
      NODE_ENV: development
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/onstage?replicaSet=rs0
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      AUTH_PASSWORD_RESET_CONSOLE_URL: "true"
    # Só na loopback: a entrada pública é o serviço `web` na 3001.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      mongo:
        condition: service_healthy

  # Entrada única (porta 3001): serve o front estático e faz proxy de /api e
  # /socket.io para a API. O Tailscale Serve aponta o HTTPS do tailnet para cá.
  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../pi-front/dist:/usr/share/nginx/html:ro
    depends_on:
      - api

  # Servico de seed (opcional). Popula o banco com dados de demonstracao.
  # Rode sob demanda:  docker compose run --rm seed
  seed:
    build: .
    profiles: ["seed"]
    environment:
      MONGO_URI: mongodb://mongo:27017/onstage?replicaSet=rs0
    command: ["npm", "run", "seed"]
    depends_on:
      mongo:
        condition: service_healthy

  bootstrap-admin:
    build: .
    profiles: ["bootstrap"]
    environment:
      MONGO_URI: mongodb://mongo:27017/onstage?replicaSet=rs0
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrador}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?BOOTSTRAP_ADMIN_EMAIL is required}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD is required}
    command: ["npm", "run", "bootstrap-admin"]
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  onstage-mongo:
