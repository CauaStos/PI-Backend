# Entrada única do deploy (Tailscale Serve -> http://127.0.0.1:3001).
# Serve o front estático e faz proxy da API e do Socket.IO para o serviço `api`.
server {
    listen 3001;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Better Auth (/api/auth/*) e REST (/api/v1/*).
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        # O TLS termina no Tailscale Serve, então a origem pública é https.
        proxy_set_header X-Forwarded-Proto https;
    }

    # Swagger.
    location /api-docs {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Socket.IO: precisa dos headers de Upgrade para o websocket.
    location /socket.io/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # SPA: rotas do react-router caem no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
